<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>OptiGuard AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="login-card">

    <!-- LEFT PANEL -->
    <div class="left-panel">
      <img src="logo.png" class="logo" alt="OptiGuard AI Logo">
      <h2>OptiGuard AI</h2>
      <p>
        Advanced AI health monitoring for early detection and clearer tomorrow
      </p>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">

      <h3>Welcome to OptiGuard AI</h3>

      <form id="authForm">

        <!-- Tabs -->
        <div class="role-buttons">
          <button type="button" class="active" onclick="showSignup()">Signup</button>
          <button type="button" onclick="showLogin()">Login</button>
        </div>

        <!-- Full Name -->
        <div id="nameField">
          <label>Full Name</label>
          <input type="text" id="fullname" placeholder="Enter Your Full Name">
        </div>

        <!-- Email -->
        <label>Email</label>
        <input type="email" id="email" placeholder="Enter Your Email">

        <!-- Password -->
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter Password">

        <!-- Main Button -->
        <button type="button" class="main-btn" id="mainActionBtn" onclick="handleAuth()">
          Create Account
        </button>

      </form>

      <div class="continue-text">Continue With</div>

      <div class="social-row">

        <!-- GOOGLE -->
        <button type="button" class="social-box" onclick="loginWithGoogle()">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg">
          Google
        </button>

        <!-- FACEBOOK -->
        <button type="button" class="social-box" onclick="loginWithFacebook()">
          <img src="https://www.svgrepo.com/show/475647/facebook-color.svg">
          Facebook
        </button>

      </div>

    </div>
  </div>

  <!-- ================= NORMAL AUTH ================= -->
  <script>
    let isSignup = true;

    function showSignup() {
      isSignup = true;
      document.getElementById("nameField").style.display = "block";
      document.getElementById("mainActionBtn").innerText = "Create Account";
    }

    function showLogin() {
      isSignup = false;
      document.getElementById("nameField").style.display = "none";
      document.getElementById("mainActionBtn").innerText = "Login";
    }

    async function handleAuth() {
      const fullname = document.getElementById("fullname")?.value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        let url = "";
        let data = {};

        if (isSignup) {
          url = "http://127.0.0.1:3000/signup";
          data = { fullname, email, password };
        } else {
          url = "http://127.0.0.1:3000/login";
          data = { email, password };
        }

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        alert(result.message);

      } catch (error) {
        alert("❌ Cannot connect to server");
      }
    }
  </script>

  <!-- ================= FIREBASE ================= -->
  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      FacebookAuthProvider,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ✅ Firebase Config (YOUR PROJECT)
    const firebaseConfig = {
      apiKey: "AIzaSyDJkB6803uB1uHpCs9TyiXAjOZlqXc08OQ",
      authDomain: "optiguardai-98cf0.firebaseapp.com",
      projectId: "optiguardai-98cf0",
      storageBucket: "optiguardai-98cf0.appspot.com",
      messagingSenderId: "533578769139",
      appId: "1:533578769139:web:f252ec05698b05e162cd86"
    };

    // ✅ Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Providers
    const googleProvider = new GoogleAuthProvider();
    const facebookProvider = new FacebookAuthProvider();

    // ================= GOOGLE LOGIN =================
    window.loginWithGoogle = function () {
      signInWithPopup(auth, googleProvider)
        .then((result) => {
          const user = result.user;

          alert("✅ Google Login: " + user.email);

          // OPTIONAL: send to backend
          fetch("http://127.0.0.1:3000/social-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: user.displayName,
              email: user.email
            })
          });

        })
        .catch((error) => {
          console.error(error);
          alert("❌ Google login failed");
        });
    };

    // ================= FACEBOOK LOGIN =================
    window.loginWithFacebook = function () {
      signInWithPopup(auth, facebookProvider)
        .then((result) => {
          const user = result.user;

          alert("✅ Facebook Login: " + user.email);

          // OPTIONAL: send to backend
          fetch("http://127.0.0.1:3000/social-login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: user.displayName,
              email: user.email
            })
          });

        })
        .catch((error) => {
          console.error(error);
          alert("❌ Facebook login failed");
        });
    };

  </script>

</body>
</html>
