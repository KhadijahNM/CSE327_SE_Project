<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiGuard AI — Test History</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/test-history.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<aside class="sidebar">
  <a href="/" class="sidebar-brand">
    <div class="brand-icon">👁</div>
    <span class="brand-name">OptiGuard AI</span>
  </a>

  <nav class="sidebar-nav">
    <span class="nav-label">Main</span>
    <a href="/dashboard" class="nav-item">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <a href="/diagnostics" class="nav-item">
      <span class="nav-icon">🔬</span> Diagnostics
    </a>
    <a href="/test-history" class="nav-item active">
      <span class="nav-icon">🧪</span> Test History
    </a>
    <a href="/donation" class="nav-item">
      <span class="nav-icon">❤️</span> Donate
    </a>
    <span class="nav-label">Account</span>
    <a href="/settings" class="nav-item">
      <span class="nav-icon">⚙️</span> Settings
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="user-row">
      <div class="user-avatar" id="sidebarAvatar">U</div>
      <div class="user-info">
        <div class="user-name" id="sidebarName">User</div>
        <div class="user-role">Patient</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Logout">↩</button>
    </div>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="topbar-left">
      <h1>Test History</h1>
      <p>Review your recent screenings and risk trends.</p>
    </div>
  </header>

  <div class="content history-content">
    <div class="dashboard">

      <!-- TITLE BAR -->
      <div class="title-bar">
        <div class="header-actions">
          <button class="icon-btn" onclick="goBack()">←</button>
          <h2 class="title-text">Test History</h2>
        </div>
      </div>

      <!-- SUBTITLE -->
      <div class="subtitle-bar">
        <h3 class="subtitle">Risk Overview</h3>
      </div>

      <!-- CHART -->
      <div class="chart-box">
        <h4 class="chart-title">Monthly Trend</h4>
        <canvas id="riskChart" height="100"></canvas>
      </div>

      <!-- STATS -->
      <div class="stats">
        <div class="stat-box">
          <h3 id="avgRisk">0%</h3>
          <p>Avg. Risk</p>
        </div>
        <div class="stat-box">
          <h3 id="totalScans">0</h3>
          <p>Total Scans</p>
        </div>
        <div class="stat-box">
          <h3 id="trendText">No Data</h3>
          <p>Trend</p>
        </div>
      </div>

      <!-- REPORTS -->
      <div class="reports">
        <div class="reports-header">
          <h3>Recent Reports</h3>
          <a href="#" id="viewAllBtn">View All</a>
        </div>
        <div id="reportsContainer"></div>
      </div>

    </div>
  </div>
</div>

<script src="/js/auth.js"></script>

<script>

function getSessionUser() {
  try {
    return JSON.parse(sessionStorage.getItem('optiUser') || 'null');
  } catch (error) {
    sessionStorage.removeItem('optiUser');
    return null;
  }
}

function requireSessionUser() {
  const user = getSessionUser();
  if (!user || !user.email) {
    window.location.href = '/login';
    return null;
  }
  return user;
}

function goBack(){
  window.history.back();
}

let allReports = [];

/* ================= FETCH DATA ================= */
async function loadReports() {
  const user = requireSessionUser();
  if (!user) return;

  try {
    const res = await fetch(`/api/scans/recent?email=${encodeURIComponent(user.email)}`);

    if (!res.ok) throw new Error("Server error");

    const data = await res.json();

    // Map API fields to expected format
    allReports = (data || []).map(r => ({
      date: r.created_at || new Date().toISOString(),
      time: r.created_at ? new Date(r.created_at).toLocaleTimeString() : "",
      risk: r.risk_score || 0,
      status: r.risk_label || "Low",
      disease: r.disease || ""
    }));

    updateStats(allReports);
    createChart(allReports);
    showReports(allReports.slice(0, 3));

  } catch (err) {
    console.error(err);
    alert("❌ Failed to load reports. Check backend server.");
  }
}

requireSessionUser();
loadReports();

/* ================= STATS ================= */
function updateStats(data){
  if (!data.length) return;

  const totalScans = data.length;
  const totalRisk = data.reduce((sum,r)=>sum+(r.risk || 0),0);
  const avgRisk = (totalRisk / totalScans).toFixed(1);

  document.getElementById("avgRisk").innerText = avgRisk + "%";
  document.getElementById("totalScans").innerText = totalScans;

  let trend = "No Data";

  if(data.length >= 2){
    const last = data[data.length-1].risk || 0;
    const prev = data[data.length-2].risk || 0;

    if(last > prev) trend = "↑ Increasing";
    else if(last < prev) trend = "↓ Decreasing";
    else trend = "→ Stable";
  }

  document.getElementById("trendText").innerText = trend;
}

/* ================= CHART ================= */
function createChart(data){

  if(!data.length) return;

  const labels = data.map(r => r.date ? new Date(r.date).toLocaleDateString() : "");
  const risks = data.map(r => r.risk || 0);

  new Chart(document.getElementById("riskChart"), {
    type: "bar",
    data: {
      labels: labels,
      datasets: [{
        data: risks
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

/* ================= REPORTS ================= */
function showReports(reports){
  const container = document.getElementById("reportsContainer");
  container.innerHTML = "";

  reports.forEach(report => {

    const status = (report.status || "low").toLowerCase();

    let statusClass = "status-low";
    if(status === "medium") statusClass = "status-medium";
    if(status === "high") statusClass = "status-high";

    const card = document.createElement("div");
    card.className = "report-item";

    card.innerHTML = `
      <div>
        <strong>${new Date(report.date).toDateString()}</strong><br>
        ${report.time || ""}
        <br>
        <span class="${statusClass}">${status}</span>
      </div>

      <div>
        <strong>${report.risk || 0}%</strong>
      </div>
    `;

    container.appendChild(card);
  });
}

/* ================= VIEW ALL ================= */
document.getElementById("viewAllBtn").onclick = function(e){
  e.preventDefault();
  showReports(allReports);
  this.style.display = "none";
};

</script>

</body>
</html>
